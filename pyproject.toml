[project]
name = "doc-control"
version = "0.4.0"
description = "Deterministic, LLM-first control of Word documents: addresses, anchors, tracked-change batches and a safety layer."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
doc-control = "doc_control.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doc_control"]

[tool.hatch.build.targets.sdist]
# Without this the sdist ships the agent tooling and planning files (.claude, arsenal, status).
include = ["/src", "/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["claude-arsenal", ".claude", "arsenal"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "RUF", # ruff-specific
    "B",   # flake8-bugbear (real bug patterns)
    "SIM", # flake8-simplify (cleaner equivalents)
    "PTH", # flake8-use-pathlib (prefer Path.open over open)
]

[tool.ruff.lint.per-file-ignores]
# The test helpers hold OOXML namespace URIs and content types as long literals.
"tests/helpers.py" = ["E501"]
"tests/ops/test_stylesets.py" = ["E501"]  # the style-sheet fixture is one long XML literal
"tests/recipes/docx_fixer_cases.py" = ["RUF001"]  # typographic characters are the test data
"tests/recipes/test_es_typography.py" = ["RUF001"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Wall-clock budgets are opt-in (`make bench`); a later `-m bench` overrides this default.
addopts = "--strict-markers -m 'not bench'"
markers = [
    "bench: wall-clock performance budgets; run with `make bench` (pytest -m bench)",
    "writes_invalid_docs: the test writes deliberately invalid packages; CI skips them in the OOXML lint",
]
