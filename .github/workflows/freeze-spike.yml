name: Freeze spike

# Throwaway (PACKAGE T1, Q1): build a one-folder doc-control.exe with PyInstaller and with
# Nuitka, then measure size, start-up and smokes with packaging/spike/measure.py. Deleted
# in the PR that records the decision (D-P6).

on:
  workflow_dispatch:
  push:
    branches: ["arsenal/t-329d1bc9-*"]

permissions:
  contents: read

concurrency:
  group: freeze-spike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freeze:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        freezer: [pyinstaller, nuitka]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
      - name: Environment with pywin32 and the freezer
        run: |
          uv sync --locked --extra live
          if [[ "${{ matrix.freezer }}" == pyinstaller ]]; then
            uv pip install "pyinstaller>=6.10,<7"
          else
            uv pip install "nuitka>=2.6,<3" ordered-set zstandard
          fi
      - name: Build one-folder exe (timed)
        id: build
        run: |
          py=.venv/Scripts/python.exe
          start=$(date +%s)
          if [[ "${{ matrix.freezer }}" == pyinstaller ]]; then
            "$py" -m PyInstaller --noconfirm --onedir --console --name doc-control \
              --collect-submodules doc_control --collect-data doc_control \
              --hidden-import pythoncom --hidden-import pywintypes \
              --hidden-import win32com.client --hidden-import winreg \
              --exclude-module tkinter \
              --distpath build-out/pyinstaller --workpath build-tmp/pyinstaller \
              --specpath build-tmp packaging/spike/entry.py
            dist=build-out/pyinstaller/doc-control
          else
            "$py" -m nuitka --standalone --assume-yes-for-downloads --msvc=latest \
              --output-dir=build-out/nuitka --output-filename=doc-control.exe \
              --include-package=doc_control --include-package-data=doc_control \
              --include-module=pythoncom --include-module=pywintypes \
              --include-module=win32com.client --include-module=winreg \
              --nofollow-import-to=tkinter --nofollow-import-to=tests \
              packaging/spike/entry.py
            dist=build-out/nuitka/entry.dist
          fi
          end=$(date +%s)
          minutes=$("$py" -c "print(round(($end - $start) / 60, 2))")
          echo "dist=$dist" >> "$GITHUB_OUTPUT"
          echo "minutes=$minutes" >> "$GITHUB_OUTPUT"
          ls -la "$dist" | head -n 40
      - name: Measure
        run: |
          set +e
          .venv/Scripts/python.exe packaging/spike/measure.py --exe doc-control.exe \
            --runs 10 --build-minutes "${{ matrix.freezer }}=${{ steps.build.outputs.minutes }}" \
            --out "spike-${{ matrix.freezer }}.json" \
            "${{ matrix.freezer }}=${{ steps.build.outputs.dist }}" > /dev/null
          status=$?
          echo "SPIKE-REPORT-BEGIN"
          cat "spike-${{ matrix.freezer }}.json"
          echo "SPIKE-REPORT-END"
          exit $status
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: spike-${{ matrix.freezer }}
          path: spike-${{ matrix.freezer }}.json
          if-no-files-found: warn
