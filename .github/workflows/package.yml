name: Package

# The frozen Windows build (PACKAGE T2), as a reusable workflow: ci.yml calls it on changes
# to packaging inputs, release.yml calls it when it releases (T8, `attach: true`). It builds the
# one-folder doc-control.exe with PyInstaller from packaging/doc-control.spec and fails
# when the uncompressed folder is over 40 MiB (gate `frozen_exe_size_mb <= 40`), then runs
# scripts/frozen_smoke.py against the exe with no Python on PATH (T3, `frozen_smoke_failures == 0`).

on:
  workflow_call:
    inputs:
      attach:
        description: "Also zip the build, write SHA256SUMS.txt and upload the four release assets as artifact windows-packages (release.yml attaches them)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  MAX_FROZEN_MB: "40"
  # Inno Setup for the installer (T7). windows-latest ships it from Chocolatey, unpinned;
  # the install step pins it to this exact version and checks ISCC.exe reports it.
  INNO_VERSION: "6.7.1"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
      - name: Environment with pywin32 and the freezer
        run: uv sync --locked --no-dev --extra live --group package
      - name: Build the one-folder exe
        run: |
          .venv/Scripts/pyinstaller.exe --noconfirm --distpath build-out --workpath build-tmp \
            packaging/doc-control.spec
          test -f build-out/doc-control/doc-control.exe
      - name: Size of the uncompressed folder
        run: |
          .venv/Scripts/python.exe - <<'PY'
          import os
          from pathlib import Path

          folder = Path("build-out/doc-control")
          total = sum(p.stat().st_size for p in folder.rglob("*") if p.is_file())
          mb = round(total / (1024 * 1024), 2)
          limit = float(os.environ["MAX_FROZEN_MB"])
          line = f"frozen_exe_size_mb={mb}"
          print(line)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"`{line}` (limit {limit:g})\n")
          if mb > limit:
              raise SystemExit(f"the frozen build is {mb} MiB, over the {limit:g} MiB limit")
          PY
      - name: Smoke test with no Python on PATH (CLI, regex find, MCP, every op family)
        # --frozen: capabilities.build must be {"frozen": true, "freezer": "pyinstaller"}.
        run: .venv/Scripts/python.exe scripts/frozen_smoke.py --exe build-out/doc-control/doc-control.exe --strip-python-path --frozen
      - name: Parity with in-process doc_control (capabilities, find over the corpus)
        run: .venv/Scripts/python.exe scripts/frozen_parity.py --exe build-out/doc-control/doc-control.exe
      # The .mcpb bundle (T6): manifest from packaging/mcpb with version and tools filled,
      # validated by the pinned mcpb CLI (gate `mcpb_manifest_errors == 0`), then the smoke
      # test again against the exe the manifest names, unpacked from the bundle.
      - name: Build the .mcpb bundle
        run: |
          version=$(.venv/Scripts/python.exe -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          mcpb="build-out/doc-control-${version}-windows-x64.mcpb"
          .venv/Scripts/python.exe scripts/build_mcpb.py --dist build-out/doc-control --out "$mcpb"
          rm -rf build-out/mcpb-unpacked
          .venv/Scripts/python.exe -m zipfile -e "$mcpb" build-out/mcpb-unpacked
          echo "MCPB_FILE=$mcpb" >> "$GITHUB_ENV"
      - name: Validate the manifest with the pinned mcpb CLI
        env:
          MCPB_VERSION: "2.1.2"
        run: |
          set +e
          out=$(npx --yes "@anthropic-ai/mcpb@${MCPB_VERSION}" validate build-out/mcpb-unpacked/manifest.json 2>&1)
          status=$?
          set -e
          echo "$out"
          # On failure, each error is a "  - " line (lines under a warnings heading excluded).
          errors=0
          if [ "$status" -ne 0 ]; then
            errors=$(awk 'tolower($0) ~ /warning/ {w=1} /ERROR/ {w=0} /^  - / && !w {n++} END {print n+0}' <<<"$out")
            [ "$errors" -gt 0 ] || errors=1
          fi
          echo "mcpb_manifest_errors == $errors"
          echo "\`mcpb_manifest_errors == $errors\` (mcpb ${MCPB_VERSION})" >> "$GITHUB_STEP_SUMMARY"
          [ "$errors" -eq 0 ]
      - name: Smoke test the exe the bundle's manifest names
        run: |
          entry=$(.venv/Scripts/python.exe -c "import json; print(json.load(open('build-out/mcpb-unpacked/manifest.json'))['server']['entry_point'])")
          .venv/Scripts/python.exe scripts/frozen_smoke.py --exe "build-out/mcpb-unpacked/$entry" --strip-python-path --frozen
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-mcpb
          path: ${{ env.MCPB_FILE }}
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-frozen
          path: build-out/doc-control
          retention-days: 7
          if-no-files-found: error
      - name: Inno Setup, pinned
        # A no-op when the image already has this version; --allow-downgrade when it moved on.
        shell: pwsh
        run: |
          choco install innosetup --version $env:INNO_VERSION --allow-downgrade -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "no ISCC at $iscc" }
          # ISCC.exe carries no file version (it reads 0.0.0.0); Chocolatey's record is the source.
          $found = ((choco list --exact innosetup --limit-output) -split '\|')[1]
          Write-Host "ISCC $found at $iscc"
          if (-not $found.StartsWith($env:INNO_VERSION)) { throw "ISCC is $found, expected $env:INNO_VERSION" }
          "ISCC=$iscc" >> $env:GITHUB_ENV
      - name: Build the installer (AppVersion from pyproject.toml)
        shell: pwsh
        run: |
          $version = (.venv/Scripts/python.exe packaging/installer/app_version.py).Trim()
          & $env:ISCC "/DAppVersion=$version" packaging/installer/doc-control.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = "build-out/doc-control-$version-windows-x64-setup.exe"
          if (-not (Test-Path $setup)) { throw "ISCC did not write $setup" }
          "SETUP_EXE=$((Resolve-Path $setup).Path)" >> $env:GITHUB_ENV
      - name: Installer smoke (silent install, capabilities from a new shell, silent uninstall)
        # The new shell takes PATH from the registry (machine + user), as a terminal opened
        # after the install would, so `doc-control` must resolve to the installed exe.
        shell: pwsh
        run: |
          $failures = 0
          function Fail([string] $why) { Write-Host "FAIL: $why"; $script:failures++ }
          function UserPathHas([string] $dir) {
            $entries = ([Environment]::GetEnvironmentVariable('Path','User') -split ';') | ForEach-Object { $_.TrimEnd('\') }
            return [bool]($entries -contains $dir)
          }
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\doc-control'
          $log = Join-Path $env:RUNNER_TEMP 'doc-control-setup.log'
          $p = Start-Process -FilePath $env:SETUP_EXE -Wait -PassThru -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', '/NORESTART', "/LOG=$log")
          if ($p.ExitCode -ne 0) { Fail "setup exited $($p.ExitCode)"; Get-Content $log -ErrorAction SilentlyContinue }
          if (-not (Test-Path (Join-Path $dir 'doc-control.exe'))) { Fail "no doc-control.exe in $dir" }
          if (-not (UserPathHas $dir)) { Fail "$dir is not on the user PATH" }

          $child = Join-Path $env:RUNNER_TEMP 'new-shell.ps1'
          Set-Content -Path $child -Encoding utf8 -Value @'
          param([string] $Dir)
          $env:Path = [Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [Environment]::GetEnvironmentVariable('Path','User')
          $cmd = Get-Command doc-control -CommandType Application -ErrorAction Stop | Select-Object -First 1
          Write-Host "doc-control resolves to $($cmd.Source)"
          if ((Split-Path $cmd.Source -Parent) -ne $Dir) { Write-Host "not the installed exe"; exit 2 }
          $out = & doc-control capabilities
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $null = $out | Out-String | ConvertFrom-Json
          Write-Host "capabilities answered JSON from the installed exe"
          '@
          pwsh -NoProfile -NonInteractive -File $child -Dir $dir
          if ($LASTEXITCODE -ne 0) { Fail "doc-control capabilities from a new shell exited $LASTEXITCODE" }

          $uninstaller = Join-Path $dir 'unins000.exe'
          if (Test-Path $uninstaller) {
            $u = Start-Process -FilePath $uninstaller -Wait -PassThru -ArgumentList @(
              '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART')
            if ($u.ExitCode -ne 0) { Fail "uninstaller exited $($u.ExitCode)" }
          } else { Fail "no uninstaller at $uninstaller" }
          # The uninstaller finishes from a copy in %TEMP%; give it a moment to remove the folder.
          for ($i = 0; $i -lt 30 -and (Test-Path $dir); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $dir) { Fail "$dir is still there after uninstall"; Get-ChildItem -Recurse $dir }
          if (UserPathHas $dir) { Fail "$dir is still on the user PATH after uninstall" }

          $line = "installer_smoke_failures == $failures"
          Write-Host $line
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "``$line``"
          if ($failures -gt 0) { exit 1 }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-installer
          path: build-out/doc-control-*-windows-x64-setup.exe
          retention-days: 7
          if-no-files-found: error
      # Release assets (T8): the zip and SHA256SUMS.txt beside the installer and .mcpb, as one
      # artifact that release.yml's attach job downloads. Only when called with attach: true.
      - name: Zip the build and write SHA256SUMS.txt
        if: inputs.attach
        run: |
          version=$(.venv/Scripts/python.exe -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          mkdir -p release-assets
          .venv/Scripts/python.exe - "$version" <<'PY'
          import sys
          import zipfile
          from pathlib import Path

          version = sys.argv[1]
          base = Path("build-out")
          out = Path("release-assets") / f"doc-control-{version}-windows-x64.zip"
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as z:
              for p in sorted((base / "doc-control").rglob("*")):
                  if p.is_file():
                      z.write(p, p.relative_to(base).as_posix())
          PY
          cp "build-out/doc-control-${version}-windows-x64-setup.exe" "build-out/doc-control-${version}-windows-x64.mcpb" release-assets/
          cd release-assets
          sha256sum "doc-control-${version}-windows-x64.zip" "doc-control-${version}-windows-x64-setup.exe" "doc-control-${version}-windows-x64.mcpb" > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - if: inputs.attach
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-packages
          path: release-assets/
          retention-days: 7
          if-no-files-found: error
