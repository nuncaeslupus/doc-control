name: Package

# The frozen Windows build (PACKAGE T2), as a reusable workflow: ci.yml calls it on changes
# to packaging inputs, release.yml will call it when it releases (T8). It builds the
# one-folder doc-control.exe with PyInstaller from packaging/doc-control.spec and fails
# when the uncompressed folder is over 40 MiB (gate `frozen_exe_size_mb <= 40`), then runs
# scripts/frozen_smoke.py against the exe with no Python on PATH (T3, `frozen_smoke_failures == 0`).

on:
  workflow_call:

permissions:
  contents: read

env:
  MAX_FROZEN_MB: "40"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
      - name: Environment with pywin32 and the freezer
        run: uv sync --locked --no-dev --extra live --group package
      - name: Build the one-folder exe
        run: |
          .venv/Scripts/pyinstaller.exe --noconfirm --distpath build-out --workpath build-tmp \
            packaging/doc-control.spec
          test -f build-out/doc-control/doc-control.exe
      - name: Size of the uncompressed folder
        run: |
          .venv/Scripts/python.exe - <<'PY'
          import os
          from pathlib import Path

          folder = Path("build-out/doc-control")
          total = sum(p.stat().st_size for p in folder.rglob("*") if p.is_file())
          mb = round(total / (1024 * 1024), 2)
          limit = float(os.environ["MAX_FROZEN_MB"])
          line = f"frozen_exe_size_mb={mb}"
          print(line)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"`{line}` (limit {limit:g})\n")
          if mb > limit:
              raise SystemExit(f"the frozen build is {mb} MiB, over the {limit:g} MiB limit")
          PY
      - name: Smoke test with no Python on PATH (CLI, regex find, MCP, every op family)
        # --frozen: capabilities.build must be {"frozen": true, "freezer": "pyinstaller"}.
        run: .venv/Scripts/python.exe scripts/frozen_smoke.py --exe build-out/doc-control/doc-control.exe --strip-python-path --frozen
      - name: Parity with in-process doc_control (capabilities, find over the corpus)
        run: .venv/Scripts/python.exe scripts/frozen_parity.py --exe build-out/doc-control/doc-control.exe
      # The .mcpb bundle (T6): manifest from packaging/mcpb with version and tools filled,
      # validated by the pinned mcpb CLI (gate `mcpb_manifest_errors == 0`), then the smoke
      # test again against the exe the manifest names, unpacked from the bundle.
      - name: Build the .mcpb bundle
        run: |
          version=$(.venv/Scripts/python.exe -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          mcpb="build-out/doc-control-${version}-windows-x64.mcpb"
          .venv/Scripts/python.exe scripts/build_mcpb.py --dist build-out/doc-control --out "$mcpb"
          rm -rf build-out/mcpb-unpacked
          .venv/Scripts/python.exe -m zipfile -e "$mcpb" build-out/mcpb-unpacked
          echo "MCPB_FILE=$mcpb" >> "$GITHUB_ENV"
      - name: Validate the manifest with the pinned mcpb CLI
        env:
          MCPB_VERSION: "2.1.2"
        run: |
          set +e
          out=$(npx --yes "@anthropic-ai/mcpb@${MCPB_VERSION}" validate build-out/mcpb-unpacked/manifest.json 2>&1)
          status=$?
          set -e
          echo "$out"
          # On failure, each error is a "  - " line (lines under a warnings heading excluded).
          errors=0
          if [ "$status" -ne 0 ]; then
            errors=$(awk 'tolower($0) ~ /warning/ {w=1} /ERROR/ {w=0} /^  - / && !w {n++} END {print n+0}' <<<"$out")
            [ "$errors" -gt 0 ] || errors=1
          fi
          echo "mcpb_manifest_errors == $errors"
          echo "\`mcpb_manifest_errors == $errors\` (mcpb ${MCPB_VERSION})" >> "$GITHUB_STEP_SUMMARY"
          [ "$errors" -eq 0 ]
      - name: Smoke test the exe the bundle's manifest names
        run: |
          entry=$(.venv/Scripts/python.exe -c "import json; print(json.load(open('build-out/mcpb-unpacked/manifest.json'))['server']['entry_point'])")
          .venv/Scripts/python.exe scripts/frozen_smoke.py --exe "build-out/mcpb-unpacked/$entry" --strip-python-path --frozen
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-mcpb
          path: ${{ env.MCPB_FILE }}
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-frozen
          path: build-out/doc-control
          retention-days: 7
          if-no-files-found: error
