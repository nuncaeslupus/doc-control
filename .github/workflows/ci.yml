name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: bash scripts/hygiene.sh

  python:
    # Activates once the package is bootstrapped (pyproject.toml exists).
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: detect
        shell: bash
        run: echo "has_pyproject=$([[ -f pyproject.toml ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.detect.outputs.has_pyproject == 'true'
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: ${{ matrix.python }}
      - if: steps.detect.outputs.has_pyproject == 'true'
        shell: bash
        # Same steps as `make check`, spelled out so Windows runners need no make.
        run: |
          uv sync --locked
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
          uv run pytest -q
      - if: steps.detect.outputs.has_pyproject != 'true'
        shell: bash
        run: echo "No pyproject.toml yet; Python checks skipped."
