name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: bash scripts/hygiene.sh

  python:
    # Activates once the package is bootstrapped (pyproject.toml exists).
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: detect
        shell: bash
        run: echo "has_pyproject=$([[ -f pyproject.toml ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.detect.outputs.has_pyproject == 'true'
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: ${{ matrix.python }}
      - if: steps.detect.outputs.has_pyproject == 'true'
        shell: bash
        # Same steps as `make check`, spelled out so Windows runners need no make.
        run: |
          uv sync
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
          uv run pytest -q
      - if: steps.detect.outputs.has_pyproject != 'true'
        shell: bash
        run: echo "No pyproject.toml yet; Python checks skipped."

  packaging-inputs:
    # Paths filter for the frozen Windows build: does this change touch what goes into it?
    # A pull request is checked out as its merge commit, whose first parent is the base;
    # a push to main is one squash-merged commit. Either way HEAD^1..HEAD is the change.
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: diff
        run: |
          pattern='^(packaging/|src/doc_control/|pyproject\.toml$|uv\.lock$|\.github/workflows/(package|ci)\.yml$)'
          if ! files=$(git diff --name-only HEAD^1 HEAD); then
            echo "no parent to compare with: building"; echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if grep -Eq "$pattern" <<<"$files"; then changed=true; else changed=false; fi
          grep -E "$pattern" <<<"$files" || true
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  package:
    # The frozen Windows build and its 40 MiB size gate (PACKAGE T2).
    needs: packaging-inputs
    if: needs.packaging-inputs.outputs.changed == 'true'
    uses: ./.github/workflows/package.yml

  validate:
    # OOXML structural lint of the generated corpus plus every package the tool's own
    # tests commit (judged on errors introduced, not errors already in the input).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - name: Run tests, keeping every package the tool wrote
        run: DOC_CONTROL_KEEP_DOCS="$RUNNER_TEMP/kept-docs" uv run pytest -q
      - name: Structural lint of corpus and kept packages
        run: uv run python scripts/ci_validate_docs.py "$RUNNER_TEMP/kept-docs"

  libreoffice:
    # LibreOffice headless round trip. REQUIRE_SOFFICE makes a missing soffice a failure,
    # never a silent skip.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOC_CONTROL_REQUIRE_SOFFICE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - name: Install LibreOffice Writer (headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer-nogui python3-uno poppler-utils
          soffice --version
      - name: Page-label checker (LibreOffice PDF, pdftotext)
        run: uv run pytest -q tests/layout
      - name: Corpus round trip
        run: uv run pytest -q tests/corpus
      - name: Round trip of packages the tool wrote
        run: |
          DOC_CONTROL_KEEP_DOCS="$RUNNER_TEMP/kept-docs" uv run pytest -q tests/safety tests/ops
          uv run python scripts/ci_validate_docs.py --roundtrip "$RUNNER_TEMP/kept-docs"

  live-libreoffice:
    # The live engine driving a real LibreOffice over UNO. The bridge (python3-uno) is
    # built for the distribution's Python, so this job runs on it, not on a uv Python.
    # REQUIRE_LIVE_LO makes an app that cannot be driven a failure, never a silent skip.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOC_CONTROL_REQUIRE_LIVE_LO: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Install LibreOffice Writer and its Python bridge
        run: |
          sudo apt-get update
          # Not the -nogui build: it has no window for a comment, and crashes when a
          # document with one is opened in a view.
          sudo apt-get install -y --no-install-recommends libreoffice-writer python3-uno
          soffice --version
      - name: Environment on the system Python, seeing its packages
        run: |
          uv venv --python /usr/bin/python3 --system-site-packages
          uv sync --locked --python /usr/bin/python3
      - name: Live engine against LibreOffice
        run: uv run --python /usr/bin/python3 pytest -q tests/live
      - name: Live select latency (p95 on the novel)
        run: uv run --python /usr/bin/python3 pytest -q -s -m bench tests/bench/test_live_select.py

  smoke-no-network:
    # The file engine runs in a Python 3.11 sandbox with no network: install the built
    # wheel into a clean venv and run the CLI with the network off.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.11"
      - run: uv build --wheel
      - run: bash scripts/smoke_no_network.sh

  bench:
    # Wall-clock budgets (`make bench`). Reported, not merge-blocking: shared runners are noisy.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - name: Run benchmarks
        shell: bash
        run: make bench 2>&1 | tee bench-results.txt
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench-results
          path: bench-results.txt
          if-no-files-found: ignore
