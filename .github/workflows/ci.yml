name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/hygiene.sh

  python:
    # Activates once the package is bootstrapped (pyproject.toml exists).
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - id: detect
        shell: bash
        run: echo "has_pyproject=$([[ -f pyproject.toml ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.detect.outputs.has_pyproject == 'true'
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - if: steps.detect.outputs.has_pyproject == 'true'
        shell: bash
        run: make check
      - if: steps.detect.outputs.has_pyproject != 'true'
        shell: bash
        run: echo "No pyproject.toml yet; Python checks skipped."
