name: Release

# Publishes to PyPI through trusted publishing (environment `pypi`), so no token is
# stored. Two ways in:
#  - merge a change to `version` in pyproject.toml into main: if tag v<version> does not
#    exist yet, the workflow builds, publishes, then creates the tag and a GitHub release;
#  - push a tag vX.Y.Z by hand that matches pyproject.toml.
# A tag created here with GITHUB_TOKEN does not re-trigger this workflow.
# The Windows packages (package.yml) are built alongside and attached to the GitHub release
# with a SHA256SUMS.txt and a `## Checksums` section in the notes (PACKAGE T8).

on:
  push:
    branches: [main]
    paths: [pyproject.toml]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: version
        name: Decide whether this push releases
        shell: bash
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
              echo "tag ${GITHUB_REF_NAME} does not match pyproject version ${version}" >&2
              exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "v${version} is already tagged: nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.release == 'true'
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - if: steps.version.outputs.release == 'true'
        run: uv build
      - if: steps.version.outputs.release == 'true'
        run: uvx twine check --strict dist/*
      - if: steps.version.outputs.release == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/doc-control/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  mcp-registry:
    # The registry checks io.github.nuncaeslupus/* against GitHub Actions' OIDC token,
    # and the package by the `mcp-name:` line in the README now on PyPI.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install mcp-publisher (pinned, checksum-verified)
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -fsSLo mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish

  tag:
    needs: [build, publish]
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.build.outputs.version }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --generate-notes

  package:
    # The Windows zip, installer and .mcpb, built and smoke-tested; nothing here publishes.
    needs: build
    if: needs.build.outputs.release == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/package.yml
    with:
      attach: true

  attach:
    # After `tag` on the branch path, or alone on the hand-pushed tag path (where `tag` is
    # skipped and there may be no release yet). `publish` must have succeeded either way.
    needs: [build, package, tag, publish]
    if: >-
      always() && needs.package.result == 'success' && needs.publish.result == 'success' &&
      (needs.tag.result == 'success' || needs.tag.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-packages
          path: assets/
      - name: Create the release if absent, upload the assets, write the checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes
          fi
          (cd assets && sha256sum -c SHA256SUMS.txt)
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber             assets/*.zip assets/*-setup.exe assets/*.mcpb assets/SHA256SUMS.txt
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          # Drop a previous ## Checksums section (a re-run), then append the current one.
          awk '/^## Checksums$/ {skip=1; next} skip && /^## / {skip=0} !skip' notes.md > notes-new.md
          {
            echo
            echo "## Checksums"
            echo
            echo '```'
            cat assets/SHA256SUMS.txt
            echo '```'
          } >> notes-new.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes-new.md
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Every asset attached, each with a checksum line
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.build.outputs.version }}
        run: python3 scripts/check_release_assets.py --tag "$TAG" | tee -a "$GITHUB_STEP_SUMMARY"
