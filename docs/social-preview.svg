<text x="100" y="400" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="46" fill="#1f1d2b">Let AI agents edit Word documents safely.</text>
<text x="100" y="452" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="26" fill="#6c687a">Deterministic .docx edits — every change a tracked change the writer can reject.</text>
